name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_STACK_PROJECT_ID: a0000000-0000-4000-a000-000000000000
      NEXT_PUBLIC_STACK_PUBLISHABLE_CLIENT_KEY: dummy
      STACK_SECRET_SERVER_KEY: dummy
      DATABASE_URL: postgresql://user:pass@localhost:5432/dummy

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
